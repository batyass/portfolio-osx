<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="90%">
      <stop offset="0%" stop-color="#1b2b4f"/>
      <stop offset="55%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#070b18"/>
    </radialGradient>
    <radialGradient id="aurora1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3f8ad8" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#2a5fae" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2a5fae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#46c7d8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#46c7d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7a5fd8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7a5fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4aa3e8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#59c8f5" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#3f7fd6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2a5fae" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="ribblur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#sky)"/>

  <g filter="url(#soft)">
    <ellipse cx="420" cy="330" rx="760" ry="420" fill="url(#aurora1)" transform="rotate(-18 420 330)"/>
    <ellipse cx="1560" cy="300" rx="700" ry="380" fill="url(#aurora3)" transform="rotate(14 1560 300)"/>
    <ellipse cx="960" cy="720" rx="950" ry="360" fill="url(#aurora2)" transform="rotate(-6 960 720)"/>
    <ellipse cx="240" cy="980" rx="600" ry="300" fill="url(#aurora1)"/>
    <ellipse cx="1700" cy="1020" rx="640" ry="320" fill="url(#aurora2)"/>
  </g>

  <g filter="url(#ribblur)">

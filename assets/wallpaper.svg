    <path d="M-50 660 C 380 500, 620 820, 1040 640 S 1600 460, 2040 600" fill="none" stroke="url(#ribbon)" stroke-width="90" stroke-linecap="round" opacity="0.7"/>
  </g>

  <g fill="#dfeaff">
    <circle cx="180" cy="140" r="2.2"/><circle cx="520" cy="90" r="1.6"/><circle cx="880" cy="160" r="2.6"/>
    <circle cx="1180" cy="80" r="1.8"/><circle cx="1500" cy="150" r="2.2"/><circle cx="1760" cy="90" r="1.5"/>
    <circle cx="320" cy="260" r="1.5"/><circle cx="700" cy="230" r="1.8"/><circle cx="1040" cy="280" r="1.4"/>
    <circle cx="1360" cy="230" r="2"/><circle cx="1660" cy="280" r="1.6"/><circle cx="1890" cy="180" r="1.4"/>
    <circle cx="90" cy="420" r="1.5"/><circle cx="1840" cy="440" r="1.8"/><circle cx="1180" cy="390" r="1.3"/>

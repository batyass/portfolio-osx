<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio — Mac OS X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Écran de démarrage façon Mac -->
    <div id="loader-wrapper">
        <img class="boot-logo" src="./assets/apple_logo.svg" alt="Apple">
        <div class="boot-progress">
            <div class="boot-progress-fill" id="fill"></div>
        </div>
        <p class="boot-text">Démarrage de Mac OS X…</p>
    </div>

    <!-- Barre de menus macOS -->
    <div id="menubar" class="menubar">
        <div class="menu-left">
            <span class="menu-apple"><img src="./assets/apple_logo.svg" alt=""></span>
            <span class="menu-item">Fichier</span>
            <span class="menu-item">Édition</span>
            <span class="menu-item">Présentation</span>
            <span class="menu-item">Aller</span>
            <span class="menu-item">Fenêtre</span>
            <span class="menu-item">Aide</span>
        </div>
        <div class="menu-right">
            <span class="menu-status" title="Réseau">
                <svg width="15" height="12" viewBox="0 0 15 12" fill="none">
                    <path d="M1 4.5C4 1.5 11 1.5 14 4.5" stroke="#222" stroke-width="1.4" stroke-linecap="round"/>
                    <path d="M3.2 6.8C5.4 4.6 9.6 4.6 11.8 6.8" stroke="#222" stroke-width="1.4" stroke-linecap="round"/>
                    <path d="M5.4 9.1C6.6 7.9 8.4 7.9 9.6 9.1" stroke="#222" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="menu-status" title="Batterie">
                <svg width="22" height="12" viewBox="0 0 22 12" fill="none">
                    <rect x="0.7" y="0.7" width="18" height="10.6" rx="2.5" stroke="#222" stroke-width="1.2"/>
                    <rect x="2.4" y="2.4" width="13" height="7.2" rx="1.2" fill="#222"/>
                    <path d="M20.5 3.8v4.4c1-.3 1.4-1.1 1.4-2.2s-.4-1.9-1.4-2.2z" fill="#222"/>
                </svg>
            </span>
            <span class="menu-status menu-vol" title="Volume">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M1 4.5v3h2.2L7 10.5v-9L3.2 4.5H1z" fill="#222"/>
                    <path d="M8.4 4.2c.6.9.6 2.7 0 3.6M9.8 3c1.1 1.4 1.1 4.6 0 6" stroke="#222" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
            </span>
            <span id="menubar-date" class="menu-status menu-date"></span>
            <span id="menubar-clock" class="menu-status menu-clock"></span>
        </div>
    </div>

    <!-- Bureau -->
    <div id="desktop" class="desktop"></div>

    <!-- Dock macOS -->
    <div id="dock-zone" class="dock-zone">
        <div id="dock" class="dock">
            <div class="dock-icons" id="dock-icons"></div>
        </div>
    </div>

    <script type="module" src="./index.js?v=2"></script>
</body>
</html>
